name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Supersede outdated pull request runs; every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static checks
        run: npm run validate:static

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported runtime and the newest release of each supported line.
        node-version:
          - 24.15.0
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install and build with the contributor toolchain, whose npm satisfies devEngines.
      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      # Resolve the newest release of the line instead of an older cached runner copy.
      - name: Set up runtime Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Capture runtime executable
        id: runtime-node
        run: echo "executable=$(node --print process.execPath)" >> "$GITHUB_OUTPUT"

      # `node --run` skips npm's devEngines check, which the npm of Node.js 24.15.0 fails.
      - name: Test
        run: node --run test

      # npm packs and installs with the contributor toolchain again; the consumer programs run on
      # the runtime Node.js.
      - name: Restore development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test packed consumers
        env:
          PACKAGE_CONSUMER_NODE: ${{ steps.runtime-node.outputs.executable }}
        run: npm run test:package:built

  macos:
    name: macOS packed consumers
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The temporary directory of macOS is a symbolic link, which Linux runners do not show.
      - name: Test packed consumers
        run: npm run test:package

  minimum-peers:
    name: Minimum peer versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PACKAGE_PEER_SCENARIO: minimum
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The consumers install the lower bound of every peer range in package.json.
      - name: Test packed consumers with minimum peers
        run: npm run test:package

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # npm audit reads the lockfile, so nothing is installed. As its own job, an advisory that
      # was published after the last dependency change fails CI without hiding other results.
      - name: Audit dependencies
        run: npm audit --audit-level=low

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Compares the pull request's base and head dependency graphs; no checkout is needed.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # The single status for rulesets: it fails unless every job above succeeded.
  # Dependency Review is skipped outside pull requests.
  result:
    name: CI result
    if: ${{ always() }}
    needs:
      - static
      - test
      - macos
      - minimum-peers
      - audit
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq --raw-output 'to_entries[]
            | select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped"))
            | "\(.key)=\(.value.result)"' <<< "${NEEDS}")"

          if [ -n "${failed}" ]; then
            echo "::error::CI jobs did not succeed: $(echo "${failed}" | tr '\n' ' ')"
            exit 1
          fi
